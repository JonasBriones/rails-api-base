name: CI - TEST CODE

on:
  push:
    branches:
        - develop
        - 'feature/**'
  pull_request:
    branches:
        - develop

jobs:
  test:
    name: Run RSpec and Linters
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
        - name: Revisión de código
          uses: actions/checkout@v3

